[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loadstar-mcp"
version = "0.1.0"
description = "LOADSTAR MCP server — exposes LOADSTAR project management tools via Model Context Protocol"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "pydantic>=2.0",
]

[project.scripts]
loadstar-mcp = "loadstar_mcp.server:main"

[project.urls]
Repository = "https://github.com/openLoadstar/mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/loadstar_mcp"]
